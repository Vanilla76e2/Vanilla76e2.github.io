name: Deploy DrillOps Manual

on:
  push:
    branches:
      - main
    paths:
      - '.sources/drillops-manual/**'
      - '.github/workflows/deploy-drillops-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .sources/drillops-manual/my-website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .sources/drillops-manual/my-website

      - name: Build site
        run: npm run build
        working-directory: .sources/drillops-manual/my-website

      - name: Deploy to DrillOps.Manual/
        run: |
          rm -rf DrillOps.Manual/*
          cp -r .sources/drillops-manual/my-website/build/* DrillOps.Manual/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DrillOps.Manual/
          git diff --staged --quiet || git commit -m "Deploy DrillOps manual [skip ci]"
          git push
