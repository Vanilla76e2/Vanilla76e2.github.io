name: Deploy DrillOps Manual

on:
  push:
    branches:
      - main
    paths:
      - '.sources/drillops-manual/**'
      - '.github/workflows/deploy-drillops-manual.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .sources/drillops-manual/my-website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .sources/drillops-manual/my-website

      - name: Build site
        run: npm run build
        working-directory: .sources/drillops-manual/my-website

      - name: Deploy to DrillOps.Manual/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: .sources/drillops-manual/my-website/build
          destination_dir: DrillOps.Manual
          keep_files: true
